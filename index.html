<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Calculadora de Engome</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🥁</text></svg>" />
<link rel="stylesheet" href="style.css" />
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.185.1/examples/jsm/"
  }
}
</script>
</head>
<body>
<header class="topbar">
  <h1>Calculadora de Engome</h1>
</header>

<main>
  <section id="tab-viewer" class="tab-panel active">
    <div class="viewer-layout">
      <div class="viewer-canvas-wrap">
        <div id="viewer-canvas"></div>
        <div class="viewer-hint">Arraste para girar &middot; role para zoom &middot; clique em uma peça para identificá-la</div>
        <div id="part-label" class="part-label hidden"></div>
        <label class="wood-toggle">
          <input type="checkbox" id="toggle-wood" checked />
          Mostrar madeira do bojo
        </label>
      </div>
      <aside class="parts-list-wrap">
        <h2>Partes do Engome</h2>
        <p class="muted">Clique em uma peça para destacá-la no modelo.</p>
        <ul id="parts-list" class="parts-list"></ul>
      </aside>
    </div>
  </section>
</main>

<script type="module" src="app.js"></script>
</body>
</html>
